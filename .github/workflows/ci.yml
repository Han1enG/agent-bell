name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      - run: node --test integrations/agentbell-tabby/bridge.test.js integrations/agentbell-tabby/context.test.js
      - run: brew install tmux
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java IPC regression
        run: |
          curl --fail --retry 3 -L https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar -o "$RUNNER_TEMP/gson.jar"
          AGENTBELL_JAVA_HOME="$JAVA_HOME" AGENTBELL_GSON_JAR="$RUNNER_TEMP/gson.jar" python3 integrations/agentbell-jetbrains/test_bridge.py
      - run: python3 scripts/tmux_e2e.py
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Build and verify signed release bundles
        run: ./scripts/build-macos.sh
        env:
          OUT_DIR: ${{ runner.temp }}/agentbell-release

      - name: Release bundle smoke
        run: ./scripts/release-smoke.sh "$RUNNER_TEMP/agentbell-release"
      - name: Attention Center native lifecycle E2E (synthetic hooks)
        run: ./scripts/release-attention-e2e.sh "$RUNNER_TEMP/agentbell-release"
      - uses: actions/upload-artifact@v4
        with:
          name: agentbell-v0.5-rc-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/agentbell-release/agentbell_*_darwin_*.tar.gz
            ${{ runner.temp }}/agentbell-release/checksums.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v0.2.') || startsWith(github.ref, 'refs/tags/v0.3.') || startsWith(github.ref, 'refs/tags/v0.4.') || startsWith(github.ref, 'refs/tags/v0.5.')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-macos.sh
        env:
          VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ startsWith(github.ref, 'refs/tags/v0.5.') && 'docs/RELEASE_NOTES_V05.md' || 'docs/RELEASE_NOTES_V04.md' }}
          files: |
            dist/release/agentbell_*_darwin_*.tar.gz
            dist/release/checksums.txt
