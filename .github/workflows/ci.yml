name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...
      - name: Build and verify signed release bundles
        run: ./scripts/build-macos.sh
        env:
          OUT_DIR: ${{ runner.temp }}/agentbell-release

  release:
    if: startsWith(github.ref, 'refs/tags/v0.2.')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-macos.sh
        env:
          VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/agentbell_*_darwin_*.tar.gz
            dist/release/checksums.txt
